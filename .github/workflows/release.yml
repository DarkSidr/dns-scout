name: Test and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - run: go test -race ./...
      - run: go vet ./...
      - run: node --check files/www/luci-static/resources/view/services/dns-scout.js
      - run: node scripts/test-ui.cjs
      - run: sh -n install.sh scripts/build-all.sh
      - run: python3 -m py_compile scripts/build-release.py scripts/import-gist.py
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Check version tag
        run: |
          package_version="$(cat VERSION)-r$(cat RELEASE)"
          test "$GITHUB_REF_NAME" = "v$package_version"
          test -f "docs/releases/$package_version.md"
      - name: Obtain verified OpenWrt packaging tools
        run: |
          curl --fail --location --retry 3 https://downloads.openwrt.org/releases/25.12.4/targets/mediatek/filogic/openwrt-sdk-25.12.4-mediatek-filogic_gcc-14.3.0_musl.Linux-x86_64.tar.zst -o /tmp/sdk.tar.zst
          echo '411a2277ca10f909c30275a506aab4dc28a4f1281d7fda4f19faaa2ded6630bb  /tmp/sdk.tar.zst' | sha256sum -c -
          mkdir -p /tmp/scout-sdk
          tar --zstd -xf /tmp/sdk.tar.zst -C /tmp/scout-sdk --strip-components=1 --wildcards \
            '*/staging_dir/host/bin/apk' '*/staging_dir/host/bin/.apk.bin' \
            '*/staging_dir/host/bin/fake*' '*/staging_dir/host/bin/.faked.bin' \
            '*/staging_dir/host/lib/*'
      - name: Build all packages
        env:
          STAGING_DIR_HOST: /tmp/scout-sdk/staging_dir/host
        run: '"$STAGING_DIR_HOST/bin/fakeroot" sh scripts/build-all.sh'
      - name: Verify checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          package_version="$(cat VERSION)-r$(cat RELEASE)"
          gh release create "$GITHUB_REF_NAME" dist/*.apk dist/*.ipk dist/release.json dist/SHA256SUMS \
            --verify-tag --title "DNS Scout $package_version" --notes-file "docs/releases/$package_version.md"
